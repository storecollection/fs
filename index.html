<head>
    <title>Login Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        .container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: darkblue;
        }
        .error {
            color: red;
            font-size: 14px;
        }
    </style>

    <script>
        function validateForm() {
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            // Regular Expression for Email
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            // Regular Expression for Password
            // At least 6 characters, 1 uppercase, 1 lowercase, 1 digit
            let passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{6,}$/;

            let errorMsg = "";

            if (!email.match(emailPattern)) {
                errorMsg += "Invalid Email format<br>";
            }

            if (!password.match(passwordPattern)) {
                errorMsg += "Password must be at least 6 characters, include uppercase, lowercase, and number<br>";
            }

            if (errorMsg !== "") {
                document.getElementById("error").innerHTML = errorMsg;
                return false;
            }

            alert("Login Successful!");
            return true;
        }
    </script>
</head>

<body>

<div class="container">
    <h2>Login</h2>

    <form onsubmit="return validateForm()">
        <label>Email:</label>
        <input type="text" id="email" placeholder="Enter Email">

        <label>Password:</label>
        <input type="password" id="password" placeholder="Enter Password">

        <div id="error" class="error"></div>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>

  const http = require("http");
const fs = require("fs");
const querystring = require("querystring");

const server = http.createServer((req, res) => {

    if (req.method === "GET") {
        // Serve HTML form
        fs.readFile("index.html", (err, data) => {
            res.writeHead(200, { "Content-Type": "text/html" });
            res.write(data);
            res.end();
        });
    }

    else if (req.method === "POST") {
        let body = "";

        req.on("data", chunk => {
            body += chunk.toString();
        });

        req.on("end", () => {
            const parsed = querystring.parse(body);

            const file1 = parsed.file1;
            const file2 = parsed.file2;

            // Read first file
            fs.readFile(file1, "utf8", (err, data) => {
                if (err) {
                    res.end("Error reading first file");
                    return;
                }

                // Append to second file
                fs.appendFile(file2, data, (err) => {
                    if (err) {
                        res.end("Error appending to second file");
                        return;
                    }

                    res.end("Content appended successfully!");
                });
            });
        });
    }
});

server.listen(3000, () => {
    console.log("Server running at http://localhost:3000");

            const http = require("http");
const fs = require("fs");
const querystring = require("querystring");

// Dummy user
const user = {
    email: "student@gmail.com",
    password: "1234"
};

// Load courses
const courses = JSON.parse(fs.readFileSync("courses.json"));

const server = http.createServer((req, res) => {

    if (req.method === "GET" && req.url === "/") {
        fs.readFile("login.html", (err, data) => {
            res.writeHead(200, { "Content-Type": "text/html" });
            res.end(data);
        });
    }

    else if (req.method === "POST" && req.url === "/login") {
        let body = "";

        req.on("data", chunk => {
            body += chunk;
        });

        req.on("end", () => {
            const data = querystring.parse(body);

            if (data.email === user.email && data.password === user.password) {
                res.writeHead(302, { "Location": "/dashboard" });
                res.end();
            } else {
                res.end("Invalid Login ❌");
            }
        });
    }

    else if (req.method === "GET" && req.url === "/dashboard") {
        let courseList = "<h2>Available Courses</h2>";

        courses.forEach((c, index) => {
            courseList += `<p>
                <a href="/course?id=${index}">${c.title}</a>
            </p>`;
        });

        res.writeHead(200, { "Content-Type": "text/html" });
        res.end(courseList);
    }

    else if (req.method === "GET" && req.url.startsWith("/course")) {
        const id = req.url.split("=")[1];
        const course = courses[id];

        let content = `<h2>${course.title}</h2>`;

        course.lessons.forEach(lesson => {
            content += `<p>${lesson}</p>`;
        });

        res.writeHead(200, { "Content-Type": "text/html" });
        res.end(content);
    }

    else {
        res.writeHead(404);
        res.end("Page Not Found");
    }

});

server.listen(3000, () => {
    console.log("Server running at http://localhost:3000");
});

    <p class="greeting" ng-show="hour < 12">Good Morning 🌅</p>
    <p class="greeting" ng-show="hour >= 12 && hour < 17">Good Afternoon ☀️</p>
    <p class="greeting" ng-show="hour >= 17">Good Evening 🌙</p>

    <h2>Student Registration</h2>

    <form name="studentForm" ng-submit="submitForm()">

        <label>First Name:</label>

            Only alphabets allowed
        </span>

        <label>Last Name:</label>
        <input type="text" ng-model="student.lname" required>
        <span class="error" ng-show="!nameValid(student.lname)">
            Only alphabets allowed
        </span>

        <label>Age:</label>
        <input type="number" ng-model="student.age" required>
        <span class="error" ng-show="!ageValid(student.age)">
            Age must be between 18 and 50
        </span>

</div>

<script>
    var app = angular.module("studentApp", []);

    app.controller("studentController", function($scope, $http) {

        // Current time
        $scope.hour = new Date().getHours();

        // Name validation (only alphabets)
        $scope.nameValid = function(name) {
            if (!name) return true;
            let pattern = /^[A-Za-z]+$/;
            return pattern.test(name);
        };

        // Age validation (18–50)
        $scope.ageValid = function(age) {
            if (!age) return true;
            return age >= 18 && age <= 50;
        };

        // Submit form (AJAX)
        $scope.submitForm = function() {

            if (!$scope.nameValid($scope.student.fname) ||
                !$scope.nameValid($scope.student.lname) ||

                .then(function(response) {
                    $scope.message = "Registration Successful ✅";
                }, function(error) {
                    $scope.message = "Error occurred ❌";
                });
        };

    });

<div class="container">
    <h2>User Validation</h2>

    <label>Username:</label>
    <input type="text" ng-model="username">

    <label>Password:</label>
    <input type="password" ng-model="password">

    <button ng-click="validate()">Validate</button>

    <p class="message">{{message}}</p>
</div>

<script>
    var app = angular.module("myApp", []);

    app.controller("myController", function($scope) {

        $scope.validate = function() {

            if (!$scope.username || $scope.username.trim() === "") {
                alert("Enter username");
                $scope.message = "";
                return;
            }

            if ($scope.username.length < 3) {
                alert("Username is too short");
                $scope.message = "";
                return;
            }

            if (!$scope.password || $scope.password.length < 8) {
                alert("Password must be minimum 8 characters");
                $scope.message = "";
                return;
            }

            $scope.message = "Valid username ✅";
        };

    });

<script>
    function copyProgram(elementId, buttonId) {
        // प्रोग्राम कोड असलेला घटक (element) मिळवा
        const elementToCopy = document.getElementById(elementId);
        const button = document.getElementById(buttonId);
        
        // <textarea> मधून टेक्स्ट मिळवा
        const textToCopy = elementToCopy.value; 

        // navigator.clipboard API वापरून टेक्स्ट कॉपी करा
        navigator.clipboard.writeText(textToCopy)
            .then(() => {
                // बटणचा मजकूर तात्पुरता बदलणे (Success feedback)
                const originalText = button.innerText;
                button.innerText = 'copied';'calendar'
    
                button.classList.add('copied');
                
                // 1.5 सेकंदांनंतर बटण पूर्ववत करा
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('copied');
                }, 1500);

            })
            .catch(err => {
                console.error('टेक्स्ट कॉपी करताना त्रुटी आली: ', err);
                alert('कॉपी करण्यात अपयश आले. ब्राउझर सेटिंग्ज तपासा किंवा मॅन्युअली कॉपी करा.');
            });
    }
</script>
